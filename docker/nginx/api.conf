# api.hawleywebdesign.com (Yii2 basic app) — http://localhost:8082
server {
    listen 8082;
    index index.php;
    error_log  /var/log/nginx/api_error.log;
    access_log /var/log/nginx/api_access.log;
    root /var/www/api-site/web;

    client_max_body_size 20M;

    # Yii pretty URLs (urlManager enablePrettyUrl + showScriptName false)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/assets/.+\.php(/|$) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api-site/web$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
