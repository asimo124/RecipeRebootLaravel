services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: recipes_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-recipes}
      DB_USERNAME: ${DB_USERNAME:-recipes}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      PGSQL_HOST: pgsql
      PGSQL_PORT: 5432
      PGSQL_DATABASE: ${PGSQL_DATABASE:-recipes}
      PGSQL_USERNAME: ${PGSQL_USERNAME:-recipes}
      PGSQL_PASSWORD: ${PGSQL_PASSWORD:-secret}
      BILLS_SITE_PATH: /var/www/bills-site
      BILLS_DB_HOST: db
      BILLS_DB_PORT: 3306
      BILLS_DB_DATABASE: ${BILLS_DB_DATABASE:-asimo124_bills}
      BILLS_DB_DATABASE3: ${BILLS_TEST_DB_DATABASE:-asimo124_bills_test}
      BILLS_DB_USERNAME: ${DB_USERNAME:-recipes}
      BILLS_DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./:/var/www/html
      - ${BILLS_SITE_HOST_PATH:-/Users/alexhawley/Library/Mobile Documents/com~apple~CloudDocs/Documents/PHPSites/BillsSite}:/var/www/bills-site:ro
    networks:
      - recipes
    depends_on:
      db:
        condition: service_healthy
      pgsql:
        condition: service_healthy

  webserver:
    image: nginx:1.27-alpine
    container_name: recipes_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - recipes
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: recipes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recipes}
      MYSQL_USER: ${DB_USERNAME:-recipes}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"
    volumes:
      - recipes_mysql8_data:/var/lib/mysql
      - ./docker/mysql/grant-recipes.sql:/docker-entrypoint-initdb.d/grant-recipes.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - recipes

  pgsql:
    image: postgres:16-alpine
    container_name: recipes_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-recipes}
      POSTGRES_USER: ${PGSQL_USERNAME:-recipes}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - recipes_pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USERNAME:-recipes} -d ${PGSQL_DATABASE:-recipes}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - recipes

networks:
  recipes:
    driver: bridge

volumes:
  recipes_mysql8_data:
  recipes_pgsql_data:
