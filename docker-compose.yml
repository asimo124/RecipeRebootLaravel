services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: recipes_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-recipes}
      DB_USERNAME: ${DB_USERNAME:-recipes}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./:/var/www/html
    networks:
      - recipes
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:1.27-alpine
    container_name: recipes_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - recipes
    depends_on:
      - app

  db:
    image: mariadb:10.11.18
    container_name: recipes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recipes}
      MYSQL_USER: ${DB_USERNAME:-recipes}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"
    volumes:
      - recipes_db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - recipes

networks:
  recipes:
    driver: bridge

volumes:
  recipes_db_data:
